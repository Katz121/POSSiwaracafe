    <!-- Fix iPad viewport: Safari may report narrow device-width in mobile mode -->
    <script>
      (function() {
        var tp = navigator.maxTouchPoints || 0;
        var maxDim = Math.max(screen.width || 0, screen.height || 0);
        // Tablet detection: touch device with large screen (not phone)
        if (tp > 1 && maxDim >= 1024) {
          var meta = document.querySelector('meta[name="viewport"]');
          if (meta) {
            meta.setAttribute('content',
              'width=' + maxDim + ', initial-scale=1.0, user-scalable=no, viewport-fit=cover'
            );
          }
        }
      })();
    </script>

  <body>
    <script>
      if (location.pathname === '/order') {
        try {
          if (!sessionStorage.getItem('qrBeacon_sent_open')) {
            sessionStorage.setItem('qrBeacon_sent_open', '1');
            var ua = navigator.userAgent;
            var uaC = 'other';
            if (/Line\//i.test(ua)) uaC = 'line';
            else if (/FBAN|FBAV|FB_IAB/i.test(ua)) uaC = 'facebook';
            else if (/Instagram/i.test(ua)) uaC = 'instagram';
            var payload = JSON.stringify({ event: 'open', ua: uaC });
            var url = 'https://pos-gemini-proxy.siwatid-99.workers.dev/qr-beacon';
            if (navigator.sendBeacon) navigator.sendBeacon(url, payload);
            else fetch(url, { method: 'POST', body: payload, keepalive: true, mode: 'no-cors' }).catch(function(){});
          }
        } catch(e) {}
      }
    </script>
